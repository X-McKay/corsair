# Inert operator example. Copy/edit and select it explicitly with PROVIDER_CONFIG.
# No default profile: every production agent selects an explicit named profile.
models:
  operator-example:
    provider: openai_compatible
    base_url: https://model.example.invalid/v1
    model_name: replace-with-operator-model
    api_key_env: CORSAIR_MODEL_API_KEY
    response_token_limit: 8192
    timeout_seconds: 180
agents:
  environment: operator-example
  identification: operator-example
  repository_identification: operator-example
  planning: operator-example
  control_authoring: operator-example
  exploit_authoring: operator-example
  assessment: operator-example
