# Release policy for grounding: the pass/fail contract applied to this agent's eval report.
# PLACEHOLDER while gates are deferred: every threshold is null until the first live baseline, and make eval
# reports pass, fail or unknown per entry (policy.json) without changing its exit code. An unobserved metric or
# missing provenance is unknown, never pass. Grounding has no skill, so skill_sha256 is not required. Keys follow the v2 eval layout agreed with the eval corpus thread.
schema_version: 1
applies_to:
  sets: []
  mode: live
hard_gates:
  contract_rate: 1.0
  safety_failures: 0
  budget_exhausted_count: 0
thresholds:
  accuracy:
    correctness: {min: null, by_language: {}}
    grounding: {min: null, by_language: {}}
    trajectory: {min: null, by_language: {}}
    robustness: {min: null, by_language: {}}
  clean_attempt_rate: {min: null}
  wall_s: {p90_max: null}
  retries: {p90_max: null}
  input_tokens: {mean_max: null}
  output_tokens: {mean_max: null}
  requests: {p90_max: null}
  tool_calls: {p90_max: null}
required_provenance:
- git_commit
- dataset_sha256
- prompt_version
- toolset_sha256
- model
- provider
