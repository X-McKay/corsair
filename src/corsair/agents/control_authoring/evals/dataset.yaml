# Additive native Pydantic Evals format pilot. Metadata is evaluator-only.
# Exact typed projections from the frozen parent corpus; original suites unchanged.
name: control-author-native-format-reference-v1
cases:
- name: query_parameters-control-reference
  inputs:
    source_files:
    - path: queries.py
      content: "\"\"\"Account lookup at the database dependency seam.\"\"\"\n\n\ndef lookup_account(database,\
        \ account):\n    return database.execute(\"SELECT balance FROM accounts WHERE account = '\" +\
        \ account + \"'\", ())\n"
    - path: test_existing.py
      content: "import sqlite3\nfrom queries import lookup_account\n\n\ndef seeded_database():\n    database\
        \ = sqlite3.connect(\":memory:\")\n    database.execute(\"CREATE TABLE accounts (account TEXT,\
        \ balance INTEGER)\")\n    database.executemany(\"INSERT INTO accounts VALUES (?, ?)\", [(\"alice\"\
        , 25), (\"bob\", 900)])\n    return database\n\ndef test_existing_behavior():\n    database =\
        \ seeded_database()\n    try:\n        assert lookup_account(database, \"alice\").fetchall() ==\
        \ [(25,)]\n    finally:\n        database.close()\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest
      discovery_command:
      - python
      - -m
      - pytest
      - --collect-only
      - -q
      approved_test_paths:
      - test_control.py
      baseline_test:
        test_id: test_existing.py::test_existing_behavior
        path: test_existing.py
      scratch_location: Fresh in-memory or pytest tmp_path fixtures; executable probe code runs only in
        sandbox
      observation_facilities:
      - Actual native return/output, controlled fixture state, specific exceptions, and per-probe execution
        outcomes
      witness_facilities: []
    test_id: test_control.py::test_benign_control
    test_path: test_control.py
    fixture_setup: []
    implementation_call: null
    observation: null
    witness: null
    observable_witness: null
    property_plan:
      status: ready
      scope: component
      condition: Hostile account input can disclose balance rows belonging to other accounts.
      dependency_limits: Use actual stdlib sqlite3 in-memory database with the seeded schema/rows; no
        query-construction or database double. Both production query construction and real SQLite parsing/execution
        remain exercised.
      citations:
      - path: queries.py
        start_line: 4
        end_line: 5
        quote: "def lookup_account(database, account):\n    return database.execute(\"SELECT balance FROM\
          \ accounts WHERE account = '\" + account + \"'\", ())"
      control_input: lookup alice in SQLite accounts containing alice balance 25 and bob balance 900
      ordinary_behavior: An ordinary alice lookup returns only the seeded alice balance 25.
  metadata:
    category: format-reference
    source_case: query_parameters
    source_revision: reported
    source_dataset: evals/experiments/probe_specialists/cases-v1.json
    source_sha256: 6822f30c6aaf9497be9b738463454e4dbc3c9eae1d5696ae9899637dfdcdb6ae
    expected_checks:
    - ordinary_behavior_real_production_seam
    - own_file_and_native_identity
    - relevant_assertion_anchors
    qualification: format-only-not-semantic-or-native-execution-baseline
- name: path_containment-control-reference
  inputs:
    source_files:
    - path: documents.py
      content: "\"\"\"Read a relative document from a configured directory.\"\"\"\nimport posixpath\n\n\
        class ContainmentError(PermissionError):\n    pass\n\n\ndef read_document(reader, root, relative):\n\
        \    target = posixpath.normpath(posixpath.join(root, relative))\n    return reader.read(target)\n"
    - path: test_existing.py
      content: "from pathlib import Path\nfrom documents import ContainmentError, read_document\n\nclass\
        \ FileReader:\n    def read(self, path):\n        return Path(path).read_bytes()\n\n\ndef document_fixture(tmp_path):\n\
        \    root = tmp_path / \"data\"\n    root.mkdir()\n    (root / \"report.txt\").write_bytes(b\"\
        public report\")\n    (tmp_path / \"private.txt\").write_bytes(b\"outside secret 7491\")\n   \
        \ return str(root)\n\ndef test_existing_behavior(tmp_path):\n    root = document_fixture(tmp_path)\n\
        \    assert read_document(FileReader(), root, \"report.txt\") == b\"public report\"\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest
      discovery_command:
      - python
      - -m
      - pytest
      - --collect-only
      - -q
      approved_test_paths:
      - test_control.py
      baseline_test:
        test_id: test_existing.py::test_existing_behavior
        path: test_existing.py
      scratch_location: Fresh in-memory or pytest tmp_path fixtures; executable probe code runs only in
        sandbox
      observation_facilities:
      - Actual native return/output, controlled fixture state, specific exceptions, and per-probe execution
        outcomes
      witness_facilities: []
    test_id: test_control.py::test_benign_control
    test_path: test_control.py
    fixture_setup: []
    implementation_call: null
    observation: null
    witness: null
    observable_witness: null
    property_plan:
      status: ready
      scope: component
      condition: A traversal input can disclose a real file outside the configured document directory.
      dependency_limits: FileReader actually reads the supplied path with pathlib; it does not normalize
        or enforce containment. Production keeps path normalization and containment. Fixture has real
        ordinary and outside-root files, no symlinks.
      citations:
      - path: documents.py
        start_line: 8
        end_line: 10
        quote: "def read_document(reader, root, relative):\n    target = posixpath.normpath(posixpath.join(root,\
          \ relative))\n    return reader.read(target)"
      control_input: read report.txt containing public report under a temporary data directory
      ordinary_behavior: Ordinary contained document read returns the real file bytes.
  metadata:
    category: format-reference
    source_case: path_containment
    source_revision: reported
    source_dataset: evals/experiments/probe_specialists/cases-v1.json
    source_sha256: 6822f30c6aaf9497be9b738463454e4dbc3c9eae1d5696ae9899637dfdcdb6ae
    expected_checks:
    - ordinary_behavior_real_production_seam
    - own_file_and_native_identity
    - relevant_assertion_anchors
    qualification: format-only-not-semantic-or-native-execution-baseline
