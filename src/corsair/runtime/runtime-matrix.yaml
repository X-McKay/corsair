# Operator-owned policy. Framework names select native coverage, not project build commands.
schema_version: corsair-lite/runtime-matrix/1
rows:
  - id: pytest-cpython312
    language: python
    image: corsair-lite-python:dev
    image_source: images/python/Dockerfile
    framework: pytest
    detect:
      - file: pyproject.toml
      - file: setup.py
      - file: setup.cfg
      - file: requirements*.txt
      - file: '**/*.py'
    evidence: pilot
    note: coverage.py; pip, uv, Poetry, setuptools and plain modules via submitted build.sh.
