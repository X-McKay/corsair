[project]
name = "corsair"
version = "0.0.0"
description = "Sandboxed security issue validation; initial platform qualification"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["pytest==9.0.2", "PyYAML==6.0.3", "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell-0.1.3-py3-none-any.whl"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["recovery: live native interruption, gateway restart, bounded output and OOM qualification", "toolchain: live native Python/Java execution and dependency diagnostics; includes gateway prerequisites", "platform: live kind and CNI qualification; requires explicit kubeconfig", "policy: live native filesystem and network policy matrix; includes gateway prerequisites", "lifecycle: live native SDK lifecycle, execution and CLI transfers; includes gateway prerequisites", "gateway: live gateway TLS and generated identity qualification", "admission: live storage and native OpenShell kernel admission; requires installed prerequisites"]
