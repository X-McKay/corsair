[project]
name = "corsair"
version = "0.1.0"
description = "Corsair lite: a deterministic differential verdict kernel with one producer agent and one blind auditor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai]==2.55.0",
    "PyYAML==6.0.3",
]

[project.scripts]
corsair = "corsair.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip==25.1.1",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "setuptools==80.9.0",
    "wheel==0.45.1",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# src/corsair is a namespace package (no __init__.py).
namespace = true
source-include = [
    "src/corsair/runtime/*.yaml",
    "src/corsair/agents/**/agent.yaml",
    "src/corsair/agents/**/instructions/*.md",
    "src/corsair/agents/**/skills/*/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "docker: runs real containers against the local Docker daemon (skipped when Docker is unavailable)",
    "live: calls the configured model endpoint (never run by default; make pilot)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "I", "W605"]
