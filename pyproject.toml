[project]
name = "corsair"
version = "0.1.0"
description = "Evidence-first security finding verification with Google ADK and Temporal"
requires-python = ">=3.12,<3.14"
dependencies = [
  "google-adk==2.13.0",
  "temporalio==1.34.0",
  "pydantic>=2.12,<3",
  "docker==7.2.0",
  "rich>=14,<15",
  "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
# LiteLLM imports its MCP conversion package even for ordinary OpenAI function tools.
providers = ["litellm[mcp]==1.106.3"]

[project.scripts]
corsair = "corsair.entrypoints.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7,<8",
    "ruff==0.17.2",
    "ty==0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "docker: requires a real Docker daemon and the Corsair image",
  "long_probe: explicitly opted-in real Docker probe exceeding 120 seconds",
  "temporal: requires a real Temporal development server",
  "live: explicitly enabled real-provider smoke test",
]

[tool.ruff]
line-length = 100
# Frozen target line numbers and canonical source digests are test inputs, not style targets.
extend-exclude = ["evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG001", "ARG002"]

[tool.coverage.run]
source = ["corsair"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "evals", "scripts"]

[tool.ty.terminal]
error-on-warning = true
