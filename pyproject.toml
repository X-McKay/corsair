[project]
name = "corsair"
version = "0.0.0"
description = "Sandboxed security issue validation with two native unit-test probes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai,temporal]==2.55.0",
    "pydantic-ai-harness[skills]==0.55.0",
    "temporalio==1.34.0",
    "PyYAML==6.0.3",
    # Native OpenShell SDK for the OpenShell sandbox backend (the version v1 qualified; release wheel, hashed in uv.lock).
    "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell-0.1.3-py3-none-any.whl",
    "rich==15.0.0",
]

[project.scripts]
corsair-v2 = "corsair.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "pydantic-evals==2.55.0",  # native eval runner for the per-agent evals (evals/agent_eval.py)
]

[tool.uv]
package = true

[tool.uv.build-backend]
# src/corsair is a namespace package (no __init__.py).
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = [
    "platform: live kind and CNI qualification; requires explicit kubeconfig (make qualify-network)",
    "admission: live storage and native OpenShell kernel admission; requires installed prerequisites (make qualify-admission)",
    "gateway: live gateway TLS and generated identity qualification; uninstalls the gateway afterwards (make qualify-gateway)",
    "openshell: live v2 OpenShell sandbox backend against .state/openshell/config.json (make qualify-openshell-v2)",
]
