[project]
name = "corsair"
version = "0.0.0"
description = "Sandboxed security issue validation; initial platform qualification"
requires-python = ">=3.12,<3.13"

[project.scripts]
corsair = "corsair.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
ui = [
    "gunicorn==26.2.0",
    "PyYAML==6.0.3",
    "pydantic==2.14.1",
    # Existing runtime contracts import the agent package; retain its native dependencies.
    "pydantic-ai-slim[temporal]==2.55.0",
    "temporalio==1.34.0",
    "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell-0.1.3-py3-none-any.whl",
]
dev = [
    "esprima==4.0.1",
    "pytest==9.0.3",
    "PyYAML==6.0.3",
    "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell-0.1.3-py3-none-any.whl",
    "pydantic-ai-slim[openai,bedrock,temporal]==2.55.0",
    "pydantic-evals[logfire]==2.55.0",
    "rich==15.0.0",
    "temporalio==1.34.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
# src/corsair is a namespace package (no __init__.py).
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = ["workspace_quota: live SPEC-0036 quota class byte, inode and containment checks on plain pods; requires make workspace-storage", "credential_placeholder: live OpenShell provider credential placeholder delivery for SPEC-0025; fake credential only", "fixture_e2e: live E2E-0 SPEC-0018 chain through the OpenShell test workspace; scripted control plus local-model runs", "test_workspace: live OpenShell TestWorkspace delivery of the reviewed SPEC-0018 pair through the native pytest runner", "untrusted_file: live fixed bounded opaque regular-file collection via native execution", "source_execution: live fixed captured-source staging and bounded native execution input binding", "execution_transport: live original owned gateway-forward interruption during bounded execution", "source_upload: live pre-execution captured-source native upload composition", "execution_artifacts: live bounded completed execution output to immutable host artifacts", "execution_receipts: live result-receipt storage refusal after native dispatch", "native_upload: live trusted single-file native CLI upload; no application transfer adapter", "adapter_execution: live bounded native execution adapter qualification", "readiness: live native default readiness sample", "adapter_lifecycle: live typed lifecycle adapter qualification", "recovery: live native interruption, gateway restart, bounded output and OOM qualification", "toolchain: live native Python/Java execution and dependency diagnostics; includes gateway prerequisites", "platform: live kind and CNI qualification; requires explicit kubeconfig", "policy: live native filesystem and network policy matrix; includes gateway prerequisites", "lifecycle: live native SDK lifecycle, execution and CLI transfers; includes gateway prerequisites", "gateway: live gateway TLS and generated identity qualification", "admission: live storage and native OpenShell kernel admission; requires installed prerequisites", "python37_case: live SPEC-0046 native pytest runner on a real CPython 3.7 benchmark case (CVE-2021-32839) in OpenShell test workspaces", "witness: live SPEC-0033 operator probe witness over the reviewed SPEC-0018 pair in OpenShell test workspaces, with the SPEC-0027 gates"]
