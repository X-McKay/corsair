[project]
name = "corsair"
version = "0.0.0"
description = "Sandboxed security issue validation with two native unit-test probes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim[openai,temporal]==2.55.0",
    "pydantic-ai-harness[skills]==0.55.0",
    "temporalio==1.34.0",
    "PyYAML==6.0.3",
]

[project.scripts]
corsair-v2 = "corsair.v2.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "pydantic-evals==2.55.0",  # native eval runner for the per-agent evals (evals/agent_eval.py)
]

[tool.uv]
package = true

[tool.uv.build-backend]
# src/corsair is a namespace package (no __init__.py).
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
