[project]
name = "corsair"
version = "0.0.0"
description = "Sandboxed security issue validation; initial platform qualification"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "PyYAML==6.0.3",
    "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/openshell-0.1.3-py3-none-any.whl",
    "pydantic-ai-slim[openai,temporal]==2.55.0",
    "pydantic-evals[logfire]==2.55.0",
    "temporalio==1.34.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers"
markers = ["untrusted_file: live fixed bounded opaque regular-file collection via native execution", "source_execution: live fixed captured-source staging and bounded native execution input binding", "execution_transport: live original owned gateway-forward interruption during bounded execution", "source_upload: live pre-execution captured-source native upload composition", "execution_artifacts: live bounded completed execution output to immutable host artifacts", "execution_receipts: live result-receipt storage refusal after native dispatch", "native_upload: live trusted single-file native CLI upload; no application transfer adapter", "adapter_execution: live bounded native execution adapter qualification", "readiness: live native default readiness sample", "adapter_lifecycle: live typed lifecycle adapter qualification", "recovery: live native interruption, gateway restart, bounded output and OOM qualification", "toolchain: live native Python/Java execution and dependency diagnostics; includes gateway prerequisites", "platform: live kind and CNI qualification; requires explicit kubeconfig", "policy: live native filesystem and network policy matrix; includes gateway prerequisites", "lifecycle: live native SDK lifecycle, execution and CLI transfers; includes gateway prerequisites", "gateway: live gateway TLS and generated identity qualification", "admission: live storage and native OpenShell kernel admission; requires installed prerequisites"]
