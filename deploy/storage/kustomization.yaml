apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - provisioner.yaml
  - sandbox-namespace.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: corsair-workspace-config
    namespace: corsair-workspace-storage
    files:
      - config.json
      - setup=setup.sh
      - teardown=teardown.sh
      - helperPod.yaml
