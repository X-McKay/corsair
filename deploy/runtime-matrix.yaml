# Operator-owned runtime matrix (SPEC-0042). Each row is one sandbox image and the exact runtime, tools and test
# frameworks it was qualified with. Selection reads this file only; agents and project files never edit it.
# Adding a row: build the image from a digest-pinned upstream base with hash-pinned offline contents, run the
# toolchain gate for that row on a fresh node, record the report, then add the row with that evidence. A row
# without qualification evidence is refused by the loader. Rows are tried in order; the first that satisfies
# every component of a requirement is selected. `selector` is reserved for an image carrying several runtimes
# (the hybrid in SPEC-0042) and must stay empty until such an image is qualified.
# `frameworks` lists the test framework versions a Corsair runner and report parser are qualified for; the
# framework itself is the project's own dependency, installed during setup, so a project version range must
# overlap the qualified range and setup then pins a version inside the overlap. A framework row's required
# `images` list names the image ids its range was qualified on, so a new image row has no framework support until
# a range is qualified on it; one framework name may have several rows with different ranges, at most one per image.
schema_version: 1
images:
