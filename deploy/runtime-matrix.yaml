# Operator-owned runtime matrix (SPEC-0042). Each row is one sandbox image and the exact runtime, tools and test
# frameworks it was checked with. Selection reads this file only; agents and project files never edit it.
# Adding a row: build the image from a digest-pinned upstream base with hash-pinned offline contents, check it, record
# the evidence, then add the row in the same PR. `qualification.evidence` says which check the row rests on:
# `image-only` (the image built, the gate body and one real case through the runner passed under plain Docker) or
# `live` (the kind/OpenShell toolchain gate passed on a fresh node). While Corsair is in active development an
# image-only row is selectable; only a live row counts as qualified in reports. The milestone gate batch upgrades
# image-only rows to live. A row without evidence is refused by the loader. Rows are tried in order; the first that
# satisfies every component of a requirement is selected. `selector` is reserved for an image carrying several
# runtimes (the hybrid in SPEC-0042) and must stay empty until such an image is qualified.
# `frameworks` lists the test framework versions a Corsair runner and report parser are checked for; the
# framework itself is the project's own dependency, installed during setup, so a project version range must
# overlap the checked range and setup then pins a version inside the overlap. A framework row's required
# `images` list names the image ids its range was checked on, so a new image row has no framework support until
# a range is checked on it; one framework name may have several rows with different ranges, at most one per image.
