apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allow-fixture-only
spec:
  podSelector: {matchLabels: {app: corsair-qualification, role: denied}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: corsair-qualification, role: echo}}
      ports: [{protocol: TCP, port: 5678}]
