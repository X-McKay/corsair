apiVersion: v1
kind: Pod
metadata:
  name: echo
  labels: {app: corsair-qualification, role: echo}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: echo
      image: qualification-echo
      args: ["-listen=:5678", "-text=corsair-network-ok"]
      ports: [{containerPort: 5678}]
      readinessProbe:
        httpGet: {path: /health, port: 5678}
        initialDelaySeconds: 1
        periodSeconds: 2
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector: {app: corsair-qualification, role: echo}
  ports: [{port: 5678, targetPort: 5678}]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-allowed
  labels: {app: corsair-qualification, role: allowed}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: probe
      image: qualification-probe
      command: [/bin/sh, -c, "sleep 86400"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Pod
metadata:
