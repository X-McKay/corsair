name: test-planning-unit-first-v2
cases:
- name: path_traversal_unguarded
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: The read_document function accepts a user supplied filename.
        Check whether ../outside.txt could be read outside the configured documents
        directory. Analyze this component only.
      target:
        symbol: read_document
        source:
          path: documents.py
          start_line: 3
          end_line: 4
          quote: "def read_document(root: Path, filename: str) -> str:\n    return\
            \ (root / filename).read_text()"
    source_files:
    - path: documents.py
      content: "from pathlib import Path\n\ndef read_document(root: Path, filename:\
        \ str) -> str:\n    return (root / filename).read_text()\n"
    - path: test_existing.py
      content: "from pathlib import Path\n\nimport documents\n\n\ndef test_reads_existing_document(tmp_path:\
        \ Path):\n    (tmp_path / \"note.txt\").write_text(\"hello\")\n    assert\
        \ documents.read_document(tmp_path, \"note.txt\") == \"hello\"\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest 9.0.2
      discovery_command: &id002
      - python
      - -m
      - pytest
      - --collect-only
      - -q
      approved_test_paths:
      - test_documents.py
      baseline_test:
        test_id: test_existing.py::test_reads_existing_document
        path: test_existing.py
      scratch_location: The per-test pytest tmp_path directory; fixtures must not
        be created elsewhere
      observation_facilities: &id003
      - Python sys.addaudithook 'open' audit events recording the file paths opened
        during a test
      - Native JUnit XML outcomes and captured stdout per test
      witness_facilities: &id004
      - id: audit_open
        kind: file_open
        description: Python sys.addaudithook 'open' events recording each path the
          test process opens during the call
  metadata:
    status: ready
    symbol: read_document
    target_path: documents.py
    required_lines:
    - 3
    - 4
    adversarial_markers:
    - ../
    required_reads:
    - documents.py
    - test_existing.py
    forbidden_markers: []
    reference_plan:
      status: ready
      scope: component
      control:
        test_id: test_documents.py::test_benign_control
        test_path: test_documents.py
        fixture_setup:
        - Create tmp_path/allowed/ containing document.txt with a benign sentinel
        - Create tmp_path/outside.txt, outside allowed/, containing a distinct outside
          sentinel
        implementation_call: documents.read_document(allowed, 'document.txt')
        input: filename 'document.txt' inside the allowed root
        required_behavior: Returns exactly the benign sentinel content
        observable_witness: Native assertion on the benign return value
        source_references:
        - &id001
          path: documents.py
          start_line: 3
          end_line: 4
        observation:
          kind: return_value
          property: Returns exactly the benign sentinel content
          seam: Call the imported real documents.read_document function with the existing
            temporary directory fixture
      security:
        test_id: test_documents.py::test_security_rejects_outside_read
        test_path: test_documents.py
        fixture_setup:
        - Create tmp_path/allowed/ containing document.txt with a benign sentinel
        - Create tmp_path/outside.txt, outside allowed/, containing a distinct outside
          sentinel
        - Read tmp_path/outside.txt before the call to show the fixture exists and
          is readable
        implementation_call: documents.read_document(allowed, '../outside.txt')
        input: filename '../outside.txt', which resolves outside the allowed root
        required_behavior: The call is rejected with the confinement ValueError and
          returns no content; the outside file is never opened
        observable_witness: Native assertion on the specific ValueError rejecting
          a path outside the root
        source_references:
        - *id001
        observation:
          kind: exception
          property: The call is rejected with the confinement ValueError and returns
            no content; the outside file is never opened
          seam: Call the imported real documents.read_document function with the existing
            temporary directory fixture
      security_expectation:
        failure_type: AssertionError
        safe_behavior: ValueError
      discovery_command: *id002
      evidence_requirements:
      - Exactly both probes execute with native per-probe outcomes
      - Review source linkage, preconditions and property assertions before execution
      citations:
      - *id001
      - path: test_existing.py
        start_line: 1
        end_line: 8
      limitations:
      - Component property only; application callers and filesystem engine behavior
        are outside the claim
    observation_mode: unit_test
    property_markers:
    - reject
    - ValueError
    - outside
    - content
  expected_output: null
  evaluators: []
