- name: native_dependency_observation
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: fetch_preview fetches any user supplied URL, so a user could
        make the service request internal addresses such as http://169.254.169.254/latest/meta-data/.
        Analyze this component only.
      target:
        symbol: fetch_preview
        source:
          path: previews.py
          start_line: 4
          end_line: 6
          quote: "def fetch_preview(url: str) -> bytes:\n    with urlopen(url, timeout=5)\
            \ as response:\n        return response.read(4096)"
    source_files:
    - path: previews.py
      content: "from urllib.request import urlopen\n\n\ndef fetch_preview(url: str)\
        \ -> bytes:\n    with urlopen(url, timeout=5) as response:\n        return\
        \ response.read(4096)\n"
    - path: test_existing_previews.py
      content: "from pathlib import Path\n\nimport previews\n\n\ndef test_preview_reads_file_url(tmp_path:\
        \ Path):\n    page = tmp_path / \"page.html\"\n    page.write_text(\"<p>preview</p>\"\
        )\n    assert previews.fetch_preview(page.as_uri()) == b\"<p>preview</p>\"\
        \n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest 9.0.2
      discovery_command: *id002
      approved_test_paths:
      - test_previews.py
      baseline_test:
        test_id: test_existing_previews.py::test_preview_reads_file_url
        path: test_existing_previews.py
      scratch_location: The per-test pytest tmp_path directory; fixtures must not
        be created elsewhere
      observation_facilities: *id003
      witness_facilities: *id004
  metadata:
    status: ready
    required_reads:
    - previews.py
    - test_existing_previews.py
    reference_plan:
      status: ready
      scope: component
      security_expectation:
        failure_type: AssertionError
        safe_behavior: no_internal_request_dispatch
      discovery_command: *id002
      evidence_requirements:
      - Both native probes execute and report separate outcomes
      - Review the real entry point and bounded recording dependency
      citations: &id007
      - path: previews.py
        start_line: 4
        end_line: 6
      limitations:
      - Request dispatch only; network resolution and server behavior require integration
        evidence
      control:
        test_id: test_previews.py::test_control
        test_path: test_previews.py
        fixture_setup:
        - Inject a recording context-manager response dependency returning fixed preview
          bytes; record URL arguments without filtering them
        implementation_call: previews.fetch_preview(url)
        input: https://example.com/preview
        required_behavior: Dispatch the benign URL and return its fixed response bytes
        observable_witness: Recorded dependency dispatch arguments and returned bytes
        observation:
          kind: dependency_call
          property: Dispatch the benign URL and return its fixed response bytes
          seam: Call real previews.fetch_preview while replacing only its imported
            urlopen dependency
          controlled_dependency: Records URL and timeout unchanged and returns fixed
            bytes; never applies an address guard
        source_references: *id007
      security:
        test_id: test_previews.py::test_exploit
        test_path: test_previews.py
        fixture_setup:
        - Inject a recording context-manager response dependency returning fixed preview
          bytes; record URL arguments without filtering them
        implementation_call: previews.fetch_preview(url)
        input: http://169.254.169.254/latest/meta-data/
        required_behavior: Reject the internal URL before calling the outbound dependency
        observable_witness: Recorded dependency dispatch arguments and returned bytes
        observation:
          kind: dependency_call
          property: Reject the internal URL before calling the outbound dependency
          seam: Call real previews.fetch_preview while replacing only its imported
            urlopen dependency
          controlled_dependency: Records URL and timeout unchanged and returns fixed
            bytes; never applies an address guard
        source_references: *id007
    symbol: fetch_preview
    target_path: previews.py
    required_lines:
    - 4
    - 5
    - 6
    adversarial_markers:
    - 169.254.169.254
    observation_mode: unit_test
    property_markers:
    - internal
    - dispatch
    - request
  expected_output: null
  evaluators: []
