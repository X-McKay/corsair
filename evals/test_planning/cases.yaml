- name: unsupported_observation
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: fetch_preview fetches any user supplied URL, so a user could make the service request internal
        addresses such as http://169.254.169.254/latest/meta-data/. Analyze this component only.
      target:
        symbol: fetch_preview
        source:
          path: previews.py
          start_line: 4
          end_line: 6
          quote: "def fetch_preview(url: str) -> bytes:\n    with urlopen(url, timeout=5) as response:\n       \
            \ return response.read(4096)"
    source_files:
    - path: previews.py
      content: "from urllib.request import urlopen\n\n\ndef fetch_preview(url: str) -> bytes:\n    with urlopen(url,\
        \ timeout=5) as response:\n        return response.read(4096)\n"
    - path: test_existing_previews.py
      content: "from pathlib import Path\n\nimport previews\n\n\ndef test_preview_reads_file_url(tmp_path: Path):\n\
        \    page = tmp_path / \"page.html\"\n    page.write_text(\"<p>preview</p>\")\n    assert previews.fetch_preview(page.as_uri())\
        \ == b\"<p>preview</p>\"\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest 9.0.2
      discovery_command: *id002
      approved_test_paths:
      - test_previews.py
      baseline_test:
        test_id: test_existing_previews.py::test_preview_reads_file_url
        path: test_existing_previews.py
      scratch_location: The per-test pytest tmp_path directory; fixtures must not be created elsewhere
      observation_facilities: *id003
      witness_facilities: *witness_facilities
  metadata:
    status: unsupported
    required_reads:
    - previews.py
    reference_plan:
      status: unsupported
      scope: component
      missing_capability: Observing an outbound request to an internal address needs a network connection observation,
        which the environment does not list
      limitations:
      - No test specification is produced; the concern remains untested at this scope
      citations:
      - path: previews.py
        start_line: 4
        end_line: 6
  expected_output: null
  evaluators: []
