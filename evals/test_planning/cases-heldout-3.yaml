- name: status_probe_certificate_unobservable
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: probe_status turns off certificate verification, so any peer that presents a self-signed or
        mismatched certificate is trusted as the real health endpoint. Analyze this component only.
      target:
        symbol: probe_status
        source:
          path: status_probe.py
          start_line: 9
          end_line: 15
          quote: "def probe_status(host: str, port: int = 443) -> str:\n    \"\"\"Ask a peer service for its health\
            \ line over TLS.\"\"\"\n    context = ssl._create_unverified_context()\n    with socket.create_connection((host,\
            \ port), timeout=5) as raw:\n        with context.wrap_socket(raw, server_hostname=host) as tls:\n \
            \           tls.sendall(b\"GET /health HTTP/1.0\\r\\n\\r\\n\")\n            return parse_status(tls.recv(1024).decode(\"\
            latin-1\"))"
    source_files:
    - path: status_probe.py
      content: "import socket\nimport ssl\n\n\ndef parse_status(reply: str) -> str:\n    return reply.split(\"\\\
        r\\n\", 1)[0]\n\n\ndef probe_status(host: str, port: int = 443) -> str:\n    \"\"\"Ask a peer service for\
        \ its health line over TLS.\"\"\"\n    context = ssl._create_unverified_context()\n    with socket.create_connection((host,\
        \ port), timeout=5) as raw:\n        with context.wrap_socket(raw, server_hostname=host) as tls:\n     \
        \       tls.sendall(b\"GET /health HTTP/1.0\\r\\n\\r\\n\")\n            return parse_status(tls.recv(1024).decode(\"\
        latin-1\"))\n"
    - path: test_status_probe_existing.py
      content: "import status_probe\n\n\ndef test_parses_status_line():\n    assert status_probe.parse_status(\"\
        HTTP/1.0 200 OK\\r\\nServer: peer\\r\\n\") == \"HTTP/1.0 200 OK\"\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest 9.0.2
      discovery_command: *id002
      approved_test_paths:
      - test_status_probe_security.py
      baseline_test:
        test_id: test_status_probe_existing.py::test_parses_status_line
        path: test_status_probe_existing.py
      scratch_location: The per-test pytest tmp_path directory; fixtures must not be created elsewhere
      observation_facilities: *id003
      witness_facilities: *id004
  metadata:
    status: unsupported
    required_reads:
    - status_probe.py
    reference_plan:
      status: unsupported
      scope: component
      missing_capability: Showing that an invalid certificate is refused needs a TLS handshake or socket connection
        observation; the only listed witness facility records file opens
      limitations:
      - No test specification is produced; the concern remains untested at this scope
      citations:
      - path: status_probe.py
        start_line: 9
        end_line: 15
  expected_output: null
  evaluators: []
