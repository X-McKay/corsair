name: test-planning-unit-v2
cases:
- name: sql_dependency_unsafe
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: Check whether lookup_account interpolates the account input
        into SQL structure; hostile input must remain a bound parameter. Assess query
        construction only.
      target:
        symbol: lookup_account
        source:
          path: queries.py
          start_line: 4
          end_line: 5
          quote: "def lookup_account(database, account):\n    return database.execute(\"\
            SELECT balance FROM accounts WHERE account = '\" + account + \"'\", ())"
    source_files:
    - path: queries.py
      content: "\"\"\"Reviewed fixture: concatenate untrusted input into SQL query\
        \ structure.\"\"\"\n\n\ndef lookup_account(database, account):\n    return\
        \ database.execute(\"SELECT balance FROM accounts WHERE account = '\" + account\
        \ + \"'\", ())\n"
    - path: test_existing.py
      content: "from queries import lookup_account\n\nclass Database:\n    def execute(self,\
        \ query, parameters):\n        return [(25,)]\n\ndef test_existing_lookup():\n\
        \    assert lookup_account(Database(), \"alice\") == [(25,)]\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest
      discovery_command: &id001
      - python
      - -m
      - pytest
      - --collect-only
      - -q
      approved_test_paths:
      - test_queries.py
      baseline_test:
        test_id: test_existing.py::test_existing_lookup
        path: test_existing.py
      scratch_location: Per-test in-memory recording dependency only
      observation_facilities:
      - Native test outcomes and assertion failure locations; assert failures report
        AssertionError
      witness_facilities: []
  metadata:
    status: ready
    symbol: lookup_account
    target_path: queries.py
    required_lines:
    - 4
    - 5
    adversarial_markers: []
    required_reads:
    - queries.py
    - test_existing.py
    reference_plan:
      status: ready
      scope: component
      security_expectation:
        failure_type: AssertionError
        safe_behavior: bound_parameter
      discovery_command: *id001
      evidence_requirements:
      - Both control and exploit probe must execute with native outcomes
      - Review both real source calls, adversarial input and assertions before execution
      citations:
      - &id002
        path: queries.py
        start_line: 4
        end_line: 5
      limitations:
      - Query construction only; database engine behavior is outside the observation
        boundary
      control:
        test_id: test_queries.py::test_benign_control
        test_path: test_queries.py
        fixture_setup:
        - Create an in-memory recording database dependency returning [(25,)] and
          recording query plus parameters unchanged
        implementation_call: queries.lookup_account(database, account)
        input: account 'alice'
        required_behavior: Benign lookup returns rows and records the expected query
          with its account argument
        observable_witness: Recorded query and parameter arguments from the real lookup_account
          call
        observation:
          kind: dependency_call
          property: Benign lookup returns rows and records the expected query with
            its account argument
          seam: Call the real imported lookup_account with an injected database dependency
          controlled_dependency: RecordingDatabase.execute records query and parameters
            unchanged and returns fixed rows; it does not construct or sanitize the
            query
        source_references:
        - *id002
      security:
        test_id: test_queries.py::test_security_preserves_query_structure
        test_path: test_queries.py
        fixture_setup:
        - Create an in-memory recording database dependency returning [(25,)] and
          recording query plus parameters unchanged
        implementation_call: queries.lookup_account(database, account)
        input: account "alice' OR 1=1 --"
        required_behavior: Hostile input remains a bound parameter and never enters
          SQL structure
        observable_witness: Recorded query and parameter arguments from the real lookup_account
          call
        observation:
          kind: dependency_call
          property: Hostile input remains a bound parameter and never enters SQL structure
          seam: Call the real imported lookup_account with an injected database dependency
          controlled_dependency: RecordingDatabase.execute records query and parameters
            unchanged and returns fixed rows; it does not construct or sanitize the
            query
        source_references:
        - *id002
    adversarial_patterns:
    - (?i)'\s+OR\s+([0-9]+)\s*=\s*\1(?=\s|--|['"]?$)
    - (?i)'\s+OR\s+'([a-z0-9_]+)'\s*=\s*'\1'?(?=\s|--|["']?$)
    observation_mode: unit_test
    property_markers:
    - parameter
    - structure
    - query
  expected_output: null
  evaluators: []
