        end_line: 3
  expected_output: null
  evaluators: []
- name: render_service_local_file_embed
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: Customers submit HTML that our render service turns into PDF invoices. Markup such as <img
        src="file:///etc/passwd"> may make the renderer embed files from the server into the PDF. Analyze this component
        only.
      target:
        symbol: submit_render
        source:
          path: render_client.py
          start_line: 5
          end_line: 9
          quote: "def submit_render(socket_path: str, markup: str) -> str:\n    with socket.socket(socket.AF_UNIX,\
            \ socket.SOCK_STREAM) as connection:\n        connection.connect(socket_path)\n        connection.sendall(json.dumps({\"\
            markup\": markup}).encode() + b\"\\n\")\n        return json.loads(connection.makefile().readline())[\"\
            job_id\"]"
    source_files:
