      sha256: c9ce06213661ad5f9b97ac64ee7ade81895d7566e090d72837cecc7ff9f07673
      content: "\"\"\"One frozen control/security pair for the reviewed synthetic\
        \ component only.\"\"\"\nimport hashlib\nimport json\nfrom pathlib import\
        \ Path\nimport sys\n\nimport pytest\nimport documents\n\n\nOPENS = []\n\n\n\
        def observe_open(event, args):\n    if event == \"open\" and isinstance(args[0],\
        \ str):\n        OPENS.append(str(Path(args[0]).resolve()))\n\n\nsys.addaudithook(observe_open)\n\
        \n\n@pytest.fixture\ndef files(tmp_path):\n    allowed = tmp_path / \"allowed\"\
        \n    allowed.mkdir()\n    (allowed / \"document.txt\").write_text(\"benign-control-sentinel\"\
        )\n    outside = tmp_path / \"outside.txt\"\n    outside.write_text(\"synthetic-outside-sentinel\"\
        )\n    return allowed, outside\n\n\ndef witness(test, events, result=None,\
        \ error=None):\n    print(json.dumps({\"test\": test, \"source_sha256\": hashlib.sha256(\n\
        \        Path(documents.__file__).read_bytes()).hexdigest(), \"opens\": events,\n\
        \        \"returned_sha256\": hashlib.sha256(result.encode()).hexdigest()\
        \ if result is not None else None,\n        \"exception\": type(error).__name__\
        \ if error is not None else None}, sort_keys=True))\n\n\ndef test_benign_control(files):\n\
        \    allowed, _ = files\n    start = len(OPENS)\n    result = documents.read_document(allowed,\
        \ \"document.txt\")\n    events = OPENS[start:]\n    witness(\"control\",\
        \ events, result)\n    assert result == \"benign-control-sentinel\"\n    assert\
        \ str(allowed / \"document.txt\") in events\n\n\ndef test_security_rejects_outside_read(files):\n\
        \    allowed, outside = files\n    # Establish the scratch fixture is readable\
        \ before observing application behavior.\n    assert outside.read_text() ==\
        \ \"synthetic-outside-sentinel\"\n    start = len(OPENS)\n    result = None\n\
        \    rejection = None\n    try:\n        result = documents.read_document(allowed,\
        \ \"../outside.txt\")\n    except ValueError as error:\n        # The reviewed\
        \ fixed source raises this precise confinement exception.\n        assert\
        \ \"not in the subpath\" in str(error)\n        rejection = error\n    events\
        \ = OPENS[start:]\n    witness(\"security\", events, result, rejection)\n\
        \    assert str(outside) not in events, \"security assertion: application\
        \ opened the outside fixture\"\n    assert rejection is not None, \"security\
        \ assertion: traversal must be rejected\"\n    assert result is None\n"
