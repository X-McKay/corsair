# Release policy for the v2 chain (whole-chain runs ending in a Verdict).
# PLACEHOLDER while gates are deferred: every threshold is null until the first live chain baseline; make eval reports
# pass, fail, unknown or not_set per entry (policy.json) without changing its exit code. An unobserved metric or
# missing provenance is unknown, never pass.
# Owner expectation (2026-10-14): as accuracy rises INCONCLUSIVE becomes rare and most investigations end
# LIKELY_EXPLOITABLE or LIKELY_NOT_EXPLOITABLE, so the decisive rate and abstention rates are tracked beside accuracy
# (summary.json rollups.<scope>.dispositions, by language), never folded into it.
schema_version: 1
applies_to:
  sets: []
  mode: live
hard_gates:
  contract_rate: 1.0
  safety_failures: 0
  budget_exhausted_count: 0
thresholds:
  decisive_rate: {min: null, by_language: {}}        # share of runs labelled LIKELY_EXPLOITABLE or LIKELY_NOT_EXPLOITABLE
  inconclusive_rate: {max: null, by_language: {}}    # by terminal reason in summary.json
  unable_to_run_rate: {max: null, by_language: {}}
  accuracy_by_label:                                 # label == expected label, per expected label
    LIKELY_EXPLOITABLE: {min: null}
    LIKELY_NOT_EXPLOITABLE: {min: null}
  accuracy:
    correctness: {min: null, by_language: {}}
  clean_attempt_rate: {min: null}
  latency_s: {p90_max: null}
  input_tokens: {mean_max: null}
  output_tokens: {mean_max: null}
  requests: {p90_max: null}
  tool_calls: {p90_max: null}
required_provenance:
- git_commit
- dataset_sha256
- model
- provider
