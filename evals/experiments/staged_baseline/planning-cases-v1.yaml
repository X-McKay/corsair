- name: jest-recording-positive
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reported_issue: Check whether user name can become template structure rather
        than a literal rendering value.
      target:
        symbol: renderPreview
        source:
          path: preview.js
          start_line: 1
          end_line: 3
          quote: "export function renderPreview(client, name) {\n  return client.render({template:\
            \ 'preview', value: name});\n}"
      reason: null
    source_files:
    - path: preview.js
      content: "export function renderPreview(client, name) {\n  return client.render({template:\
        \ 'preview', value: name});\n}\n"
    - path: existing.test.js
      content: "import {renderPreview} from './preview.js';\nfunction recorder() {\
        \ const calls = []; return {calls, render: args => { calls.push(args); return\
        \ 'ok'; }}; }\ntest('control', () => {\n  const client = recorder();\n  expect(renderPreview(client,\
        \ 'Alice')).toBe('ok');\n  expect(client.calls).toEqual([{template: 'preview',\
        \ value: 'Alice'}]);\n});\ntest('existing_adversarial', () => {\n  const client\
        \ = recorder();\n  expect(renderPreview(client, '{{admin}}')).toBe('ok');\n\
        \  expect(client.calls).toEqual([{template: 'preview', value: '{{admin}}'}]);\n\
        });\n"
    environment:
      language: JavaScript
      runtime: Node fixture
      framework: Jest
      discovery_command: &id009
      - npx
      - jest
      - --listTests
      - --json
      approved_test_paths:
      - preview.test.js
      baseline_test:
        path: existing.test.js
        test_id: existing.test.js::control
      scratch_location: in-memory recording client
      observation_facilities:
      - native assertions and recorded client arguments
      witness_facilities: []
  metadata:
    status: ready
    symbol: renderPreview
    target_path: preview.js
    required_lines:
    - 1
    - 2
    - 3
    adversarial_markers:
    - '{{admin}}'
    required_reads:
    - preview.js
    - existing.test.js
    reference_plan:
      status: ready
      scope: component
      security_expectation:
        failure_type: Error
        safe_behavior: data_remains_value
      discovery_command: *id009
      evidence_requirements:
      - Both control and exploit probe must execute with native outcomes
      - Review both real source calls, adversarial input and assertions before execution
      citations: &id010
      - path: preview.js
        start_line: 1
        end_line: 3
      limitations:
      - Argument construction only; rendering engine semantics excluded
      control:
        test_id: preview.test.js::control
        test_path: preview.test.js
        fixture_setup:
        - Rendering client records unchanged arguments and returns ok
        implementation_call: renderPreview(client, name)
        input: Alice
        required_behavior: Return ok and pass fixed template preview with unchanged
          value Alice
        observable_witness: Recorded rendering client arguments
        observation:
          kind: dependency_call
          property: fixed template and unchanged value
          seam: Imported renderPreview
          controlled_dependency: Client records arguments without parsing or sanitizing
        source_references: *id010
      security:
        test_id: preview.test.js::exploit
        test_path: preview.test.js
        fixture_setup:
        - Rendering client records unchanged arguments and returns ok
        implementation_call: renderPreview(client, name)
        input: '{{admin}}'
        required_behavior: Return ok and pass fixed template preview with unchanged
          value {{admin}}
        observable_witness: Recorded rendering client arguments
        observation:
          kind: dependency_call
          property: fixed template and unchanged value
          seam: Imported renderPreview
          controlled_dependency: Client records arguments without parsing or sanitizing
        source_references: *id010
    adversarial_patterns: []
    observation_mode: unit_test
    property_markers:
    - template
    - value
  expected_output: null
  evaluators: []
