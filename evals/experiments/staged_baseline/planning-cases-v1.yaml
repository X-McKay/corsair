name: staged-planning-v1
cases:
- name: python-recording-positive
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reason: null
      reported_issue: Check whether lookup_account interpolates the account input
        into SQL structure; hostile input must remain a bound parameter. Assess query
        construction only.
      target:
        symbol: lookup_account
        source:
          path: queries.py
          start_line: 4
          end_line: 5
          quote: "def lookup_account(database, account):\n    return database.execute(\"\
            SELECT balance FROM accounts WHERE account = '\" + account + \"'\", ())"
    source_files:
    - path: queries.py
      content: "\"\"\"Reviewed fixture: concatenate untrusted input into SQL query\
        \ structure.\"\"\"\n\n\ndef lookup_account(database, account):\n    return\
        \ database.execute(\"SELECT balance FROM accounts WHERE account = '\" + account\
        \ + \"'\", ())\n"
    - path: test_existing.py
      content: "from queries import lookup_account\n\nclass Database:\n    def execute(self,\
        \ query, parameters):\n        return [(25,)]\n\ndef test_existing_lookup():\n\
        \    assert lookup_account(Database(), \"alice\") == [(25,)]\n"
    environment:
      language: Python
      runtime: CPython 3.12
      framework: pytest
      discovery_command: &id001
      - python
      - -m
      - pytest
      - --collect-only
      - -q
      approved_test_paths:
      - test_queries.py
      baseline_test:
        test_id: test_existing.py::test_existing_lookup
        path: test_existing.py
      scratch_location: Per-test in-memory recording dependency only
      observation_facilities:
      - Native test outcomes and assertion failure locations; assert failures report
        AssertionError
      witness_facilities: []
  metadata:
    status: ready
    symbol: lookup_account
    target_path: queries.py
    required_lines:
    - 4
    - 5
    adversarial_markers: []
    required_reads:
    - queries.py
    - test_existing.py
    reference_plan:
      status: ready
      scope: component
      security_expectation:
        failure_type: AssertionError
        safe_behavior: bound_parameter
      discovery_command: *id001
      evidence_requirements:
      - Both control and exploit probe must execute with native outcomes
      - Review both real source calls, adversarial input and assertions before execution
      citations:
      - &id002
        path: queries.py
        start_line: 4
        end_line: 5
      limitations:
      - Query construction only; database engine behavior is outside the observation
        boundary
      control:
        test_id: test_queries.py::test_benign_control
        test_path: test_queries.py
        fixture_setup:
        - Create an in-memory recording database dependency returning [(25,)] and
          recording query plus parameters unchanged
        implementation_call: queries.lookup_account(database, account)
        input: account 'alice'
        required_behavior: Benign lookup returns rows and records the expected query
          with its account argument
        observable_witness: Recorded query and parameter arguments from the real lookup_account
          call
        observation:
          kind: dependency_call
          property: Benign lookup returns rows and records the expected query with
            its account argument
          seam: Call the real imported lookup_account with an injected database dependency
          controlled_dependency: RecordingDatabase.execute records query and parameters
            unchanged and returns fixed rows; it does not construct or sanitize the
            query
        source_references:
        - *id002
      security:
        test_id: test_queries.py::test_security_preserves_query_structure
        test_path: test_queries.py
        fixture_setup:
        - Create an in-memory recording database dependency returning [(25,)] and
          recording query plus parameters unchanged
        implementation_call: queries.lookup_account(database, account)
        input: account "alice' OR 1=1 --"
        required_behavior: Hostile input remains a bound parameter and never enters
          SQL structure
        observable_witness: Recorded query and parameter arguments from the real lookup_account
          call
        observation:
          kind: dependency_call
          property: Hostile input remains a bound parameter and never enters SQL structure
          seam: Call the real imported lookup_account with an injected database dependency
          controlled_dependency: RecordingDatabase.execute records query and parameters
            unchanged and returns fixed rows; it does not construct or sanitize the
            query
        source_references:
        - *id002
    adversarial_patterns:
    - (?i)'\s+OR\s+([0-9]+)\s*=\s*\1(?=\s|--|['"]?$)
    - (?i)'\s+OR\s+'([a-z0-9_]+)'\s*=\s*'\1'?(?=\s|--|["']?$)
    observation_mode: unit_test
    property_markers:
    - parameter
    - structure
    - query
  expected_output: null
  evaluators: []
- name: ruby_command_boundary-fixture-positive
  inputs:
    scope: component
    identification:
      status: ready
      scope: component
      reported_issue: User-controlled report name may select shell interpretation
        at the command construction boundary.
      target:
        symbol: run_report
        source:
          path: commands.rb
          start_line: 1
          end_line: 3
          quote: "def run_report(runner, name)\n  runner.run('report ' + name, true)\n\
            end"
      reason: null
    source_files:
    - path: commands.rb
      content: "def run_report(runner, name)\n  runner.run('report ' + name, true)\n\
        end\n"
    - path: test/control_test.rb
      content: "require_relative '../commands'\nrequire 'minitest/autorun'\nclass\
        \ ControlTest < Minitest::Test\n  def test_benign_control\n    runner = Object.new\n\
        \    def runner.run(command, shell); 'result'; end\n    assert_equal 'result',\
        \ run_report(runner, 'quarterly')\n  end\nend\n"
    environment:
      language: ruby
      runtime: unqualified local runtime
      framework: Minitest
      discovery_command: &id003
      - ruby
      - -Itest
      approved_test_paths:
      - test/new_control_test.rb
      - test/exploit_test.rb
      baseline_test:
        test_id: test/control_test.rb::ControlTest#test_benign_control
        path: test/control_test.rb
      scratch_location: isolated native unit fixture; no subprocess execution required
      observation_facilities:
      - recorded dependency arguments and production return value
      witness_facilities: []
  metadata:
    status: ready
    symbol: run_report
    target_path: commands.rb
    required_lines:
    - 1
    - 2
    - 3
    adversarial_markers:
    - quarterly; echo injected
    required_reads:
    - commands.rb
    reference_plan:
      status: ready
      scope: component
      security_expectation:
        failure_type: Minitest::Assertion
        safe_behavior: literal_argument
      discovery_command: *id003
      evidence_requirements:
      - Both control and exploit probe must execute with native outcomes
      - Review both real source calls, adversarial input and assertions before execution
      citations: &id004
      - path: commands.rb
        start_line: 1
        end_line: 3
      limitations:
      - Recording Runner may capture command and shell flag and supply a sentinel
        response; it must not implement argument construction or the shell-selection
        guard. This proves construction only, not operating-system execution.
      control:
        test_id: test/new_control_test.rb::NewControlTest#test_benign_new_control
        test_path: test/new_control_test.rb
        fixture_setup:
        - Recording runner captures command and shell flag, returns sentinel unchanged
        implementation_call: run_report(runner, name)
        input: ordinary name quarterly
        required_behavior: The production call submits report and quarterly to the
          injected runner and returns the runner response.
        observable_witness: Recorded runner arguments and return sentinel
        observation:
          kind: dependency_call
          property: The production call submits report and quarterly to the injected
            runner and returns the runner response.
          seam: Invoke run_report from imported production source
          controlled_dependency: Recording Runner may capture command and shell flag
            and supply a sentinel response; it must not implement argument construction
            or the shell-selection guard. This proves construction only, not operating-system
            execution.
        source_references: *id004
      security:
        test_id: test/exploit_test.rb::ExploitTest#test_security_safety
        test_path: test/exploit_test.rb
        fixture_setup:
        - Recording runner captures command and shell flag, returns sentinel unchanged
        implementation_call: run_report(runner, name)
        input: name quarterly; echo injected
        required_behavior: The production call must pass the entire supplied name
          as one argument with shell interpretation disabled.
        observable_witness: Recorded runner arguments and return sentinel
        observation:
          kind: dependency_call
          property: The production call must pass the entire supplied name as one
            argument with shell interpretation disabled.
          seam: Invoke run_report from imported production source
          controlled_dependency: Recording Runner may capture command and shell flag
            and supply a sentinel response; it must not implement argument construction
            or the shell-selection guard. This proves construction only, not operating-system
            execution.
        source_references: *id004
    adversarial_patterns: []
    observation_mode: unit_test
    property_markers:
    - argument
    - shell
  expected_output: null
  evaluators: []
