name: Polyglot differential oracle

on:
  pull_request:
  push:
    branches: [feature/differential-oracle-spec-0090]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.12'
      - run: uv sync --locked
      - run: make check
      - run: make test-offline
      - run: uv build

  language:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - language: python
            image: python
            context: python
          - language: java
            image: java
            context: jvm
          - language: javascript
            image: node
            context: node
          - language: typescript
            image: node
            context: node
          - language: perl
            image: perl
            context: perl
          - language: ruby
            image: ruby
            context: ruby
          - language: cpp
            image: cpp
            context: cpp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.12'
      - run: uv sync --locked
      - run: docker build -t corsair-lite-${{ matrix.image }}:dev images/${{ matrix.context }}
      - name: Replay every language fixture through offline twins
        run: uv run --locked python tools/benchmark.py --root .runs/polyglot --language ${{ matrix.language }} --run-kernel --workers 2 --output .runs/polyglot/report.json
      - name: Retain gate evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-${{ matrix.language }}
          path: .runs/polyglot/
          retention-days: 7
