name: Offline v1 suite

# Parked off the PR path with the gates (Al, 2026-10-14) until something runs end to end. `make test-config` split over
# parallel shards (TEST_SHARD=k/n, tests/conftest.py); together the shards run the whole suite. Run it from the Actions
# tab, or locally with `make test-config` (`TEST_SHARD=k/n` for one shard).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-shard:
    name: offline-shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: make test-config
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
