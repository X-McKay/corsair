name: Development

on:
  pull_request:
  push:
    branches: [claude/lite]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.12"
      - run: uv sync --locked
      - run: make test-offline
      - run: docker build -q -t corsair-lite-python:dev images/python
      - run: uv run --locked python -m pytest -q -m docker
