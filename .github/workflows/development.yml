name: Development

on:
  pull_request:
  push:
    branches: [claude/lite]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16c7ca2a5a2a7a
      - uses: astral-sh/setup-uv@d4d0e1a9c3c46c83c7e2a3e8b0bc6ea0c71f4d4d
        with:
          version: "0.11.12"
      - run: uv sync --locked
      - run: uv run --locked python -m pytest -q -m "not docker and not live"
      - run: docker build -q -t corsair-lite-python:dev images/python
      - run: uv run --locked python -m pytest -q -m docker
