name: Development guards

# Full v2 CI, restored with the gates (docs/design/gates-and-release.md). CI never calls a model: every job is offline
# and deterministic. Model-dependent checks (live per-agent baselines, live chain runs) run on the operator host and
# reach CI only as committed baselines that `release-check` reads.
#
#   offline-guards   every PR and push: `make test-v2` (unit, contract, rules, scripted agent and chain evals, guards)
#   scripted-evals   every PR and push: `make eval AGENT=<name>` per agent and the chain through the eval runner,
#                    each run's comparison and policy verdict in the job summary
#   runtime-rows     PRs that touch images, the runtime matrix, framework skills, the workspace or execution; every
#                    push to develop or main; nightly: per matrix row, rebuild its image from source, require the row's
#                    tag, classify its canaries, and run the offline suite with that image present (Docker-backed tests)
#   release-check    PRs into main and pushes to main: every agent and the chain against its committed live baseline
#                    and enforced release policy
#
# The kind/OpenShell gate is not here: it runs on the operator host when Al calls a milestone.
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes its running checks; branch pushes and nightly runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: make test-v2

  scripted-evals:
    name: scripted-evals (${{ matrix.agent }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every agent with an eval suite, and the chain; tests/configuration/test_ci_workflow.py keeps this in step.
        agent: [grounding, investigator, builder, control_prober, exploit_prober, chain]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: make eval
        env:
          AGENT: ${{ matrix.agent }}
          NOTE: ci ${{ github.sha }}
      - name: Comparison and policy in the job summary
        if: always()
        run: cat .runs/evals/*/*/comparison.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  rows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.select.outputs.rows }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      # Every row unless this is a PR that touches nothing an image, a canary or execution depends on.
      - name: Select runtime rows
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$BASE_SHA"...HEAD | grep -qE \
            '^(deploy/v2/|deploy/qualification/toolchains/|tools/(toolchain_images|v2_canary)\.py|src/corsair/v2/(skills/frameworks/|workspace/|execute|outcome|matrix|build))'; then
            echo 'rows=[]' >> "$GITHUB_OUTPUT"
          else
            echo "rows=$(uv run --locked python tools/ci_rows.py)" >> "$GITHUB_OUTPUT"
          fi

  runtime-rows:
    name: runtime-row (${{ matrix.row.id }})
    needs: rows
    if: needs.rows.outputs.rows != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.rows.outputs.rows) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Build the row's image from its source
        env:
          TOOLCHAINS: ${{ matrix.row.toolchain }}
        run: make toolchain-images TOOLCHAINS="$TOOLCHAINS"
      - name: The built image carries the row's tag
        env:
          IMAGE: ${{ matrix.row.image }}
        run: docker image inspect "$IMAGE" --format '{{.Id}}'
      - name: Classify the row's canaries
        env:
          ROW: ${{ matrix.row.id }}
        run: uv run --locked python tools/v2_canary.py --row "$ROW"
      - name: Offline suite with the image present (Docker-backed tests run)
        run: make test-v2
      - name: Build receipt and canary evidence in the log
        if: always()
        run: for f in .cache/toolchains/*/build.json .runs/canary/*.json; do [ -f "$f" ] && { echo "== $f"; cat "$f"; }; done; true

  release-check:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: make release-check
